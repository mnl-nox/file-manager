<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">File Manager em C</title>
  <desc id="desc">Banner com um terminal e pastas representando um gerenciador de arquivos escrito em C.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172b3a"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#07111d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <circle cx="1030" cy="45" r="160" fill="#2a9d8f" opacity="0.12"/>
  <circle cx="1130" cy="260" r="130" fill="#e76f51" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="64" y="62" width="500" height="196" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <rect x="64" y="62" width="500" height="34" rx="14" fill="#1e293b"/>
    <circle cx="88" cy="79" r="5" fill="#e76f51"/>
    <circle cx="106" cy="79" r="5" fill="#ffd166"/>
    <circle cx="124" cy="79" r="5" fill="#2a9d8f"/>
    <text x="88" y="132" fill="#2a9d8f" font-family="monospace" font-size="18">$ file-manager</text>
    <text x="88" y="164" fill="#cbd5e1" font-family="monospace" font-size="16">~/projects $ ls -la</text>
    <text x="88" y="194" fill="#ffd166" font-family="monospace" font-size="15">drwxr-xr-x  src/</text>
    <text x="88" y="220" fill="#94a3b8" font-family="monospace" font-size="15">-rw-r--r-- README.md</text>
  </g>

  <g transform="translate(650 78)" filter="url(#shadow)">
    <path d="M0 34h72l22 24h174a12 12 0 0 1 12 12v108a12 12 0 0 1-12 12H12a12 12 0 0 1-12-12z" fill="url(#folder)"/>
    <path d="M0 34h72l22 24H0z" fill="#ffe08a"/>
    <rect x="46" y="98" width="82" height="66" rx="6" fill="#f8fafc" opacity="0.92"/>
    <path d="M63 117h48M63 132h48M63 147h32" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round"/>
    <path d="M174 98l24 24-24 24" fill="none" stroke="#172b3a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="650" y="276" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="700">File Manager em C</text>
  <text x="654" y="302" fill="#94a3b8" font-family="sans-serif" font-size="15">Navegacao e operacoes de arquivos no terminal</text>
</svg>
