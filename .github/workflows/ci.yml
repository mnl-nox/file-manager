name: C build, tests and site validation

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build
        run: make CC=${{ matrix.compiler }}
      - name: Test
        run: make test CC=${{ matrix.compiler }}

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-asan

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site entry points
        run: |
          test -s site/index.html
          test -s site/styles.css
          grep -q 'name="viewport"' site/index.html
          grep -q 'styles.css' site/index.html
          grep -q '<title>File Manager' site/index.html
